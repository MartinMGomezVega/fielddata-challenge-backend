services:
  db:
    image: postgres:16-alpine
    container_name: agrobot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agrobot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrobot"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrobot-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/agrobot
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrobot-api
    restart: unless-stopped
    command: ["uvicorn", "agrobot.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/agrobot
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrobot-worker
    restart: unless-stopped
    command: ["python", "-m", "agrobot.worker.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/agrobot
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
